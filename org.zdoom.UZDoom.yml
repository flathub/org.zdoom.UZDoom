app-id: org.zdoom.UZDoom
runtime: org.freedesktop.Platform
sdk: org.freedesktop.Sdk
runtime-version: '25.08'
command: uzdoom

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # 3D hardware acceleration
  - --device=dri
  # Audio
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  # Controller support - change to device=input once Flatpak 1.14 is EOL.
  # https://discourse.flathub.org/t/support-for-device-input/6645
  - --device=all
  # Allow network for multiplayer gameplay
  - --share=network
  # On order to load WADs from user's game libraries
  - --filesystem=~/.var/app/com.valvesoftware.Steam/data/Steam/steamapps:ro
  - --filesystem=~/.local/share/Steam/steamapps:ro
  - --filesystem=~/snap/steam/common/.local/share/Steam/steamapps:ro

cleanup:
  - '*.a'
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc
  - /share/man

modules:
  - shared-modules/linux-audio/libinstpatch.json
  - shared-modules/linux-audio/fluidsynth2.json

  - name: uzdoom
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_CXX_FLAGS=-DSHARE_DIR=\"/app/share\"
      - -DBUILD_FLATPAK=ON
    sources:
      - type: git
        url: https://github.com/UZDoom/UZDoom
        tag: 5.0.1
        commit: b92a83674b76c295a51c2ca21ee9b3085526fecb
        disable-shallow-clone: true
        x-checker-data:
          type: git
          version-scheme: semantic
    post-install:
      - sed -i '/<mime-type type="application\/x-doom-wad">/,/<\/mime-type>/d' /app/share/mime/packages/${FLATPAK_ID}-mime.xml
